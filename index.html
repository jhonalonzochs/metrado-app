<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f59e0b">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<title>Metrado Estructural</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#f4f1ea; --surface:#ffffff; --ink:#1d2430; --muted:#667085; --line:#e3ded2;
  --accent:#f59e0b; --accent-ink:#1d1300; --soft:#faf7f0; --danger:#b42318;
  --c-zapata:#b7791f; --c-sobrecimiento:#6b7280; --c-columna:#2563eb; --c-viga:#16a34a;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14171c; --surface:#1d222a; --ink:#eef0f3; --muted:#9aa4b2; --line:#2d343f; --soft:#232a33; --danger:#f97066;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.logo{width:40px;height:40px;object-fit:contain;flex:none}
.obra{flex:1;min-width:0;font:700 18px/1.2 inherit;background:transparent;border:0;color:var(--ink);padding:6px 4px;border-radius:8px}
.obra:focus{outline:2px solid var(--accent);background:var(--surface)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;flex:none}
.menu{position:absolute;right:16px;top:60px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:230px;z-index:30}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px;border-radius:10px;font-size:15px}
.menu button:hover{background:var(--soft)}
.menu .danger{color:var(--danger)}
main{max-width:820px;margin:0 auto;padding:16px}
h2.grp{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
h2.grp i{width:12px;height:12px;border-radius:4px;display:inline-block}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left-width:6px;border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card .t b{font-size:17px}
.card .t .nv{color:var(--muted);font-size:14px}
.card .t .q{margin-left:auto;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-weight:700;font-size:14px}
.card .dm{color:var(--muted);font-size:14px;margin:2px 0 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border-radius:999px;padding:3px 12px;font-weight:700;font-size:14px;background:color-mix(in srgb,var(--accent) 22%,var(--surface));}
.chip.enc{background:color-mix(in srgb,#2563eb 16%,var(--surface))}
.chip.off{background:var(--soft);color:var(--muted);font-weight:500;border:1px dashed var(--line)}
.chip.ace{background:color-mix(in srgb,#16a34a 18%,var(--surface))}
.acb{margin:-2px 0 8px}
.ln{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px;margin:8px 0}
.ln input,.ln select{font:inherit;font-size:16px;padding:9px;border-radius:10px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);min-height:44px;width:100%}
.ln3{display:grid;grid-template-columns:1.3fr 1fr 1.2fr 44px;gap:6px;margin-top:6px}
.ln3 button{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--danger);font-size:16px}
.acb .btn{width:100%;margin-top:4px}
.empty{text-align:center;padding:40px 16px;background:var(--surface);border:2px dashed var(--line);border-radius:18px}
.empty h3{margin:8px 0}
.empty p{color:var(--muted);margin:6px auto 16px;max-width:420px}
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);min-height:48px}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.dng{background:transparent;color:var(--danger);border:1px solid var(--line)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:15;box-shadow:0 6px 20px rgba(0,0,0,.25);border-radius:999px;padding:0 22px;min-height:54px;font-size:17px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:16;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:0;padding:10px 4px 9px;font-size:13px;color:var(--muted);font-weight:600}
.tabs button span{display:block;font-size:20px;line-height:1.2}
.tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--accent)}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.kpi small{color:var(--muted);font-weight:600}
.kpi .v{font-size:30px;font-weight:800;line-height:1.1;margin-top:4px}
.kpi .v em{font-size:15px;font-style:normal;color:var(--muted);font-weight:600}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 14px 10px;margin-top:12px}
.box h3{font-size:14px;margin:10px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tr{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.tr:last-child{border-bottom:0}
.tr b{font-variant-numeric:tabular-nums}
.wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:8px 0 18px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:190px}
th{background:var(--soft);font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
tr.sub td{font-weight:700;background:var(--soft)}
tr.tot td{font-weight:800;font-size:15px;background:color-mix(in srgb,var(--accent) 25%,var(--surface))}
h2.part{font-size:17px;margin:20px 0 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 0}
/* Editor */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:94dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
@media (min-width:720px){.sheet{align-items:center}.panel{border-radius:22px;max-height:90dvh}}
.ph{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 0 10px;z-index:2}
.ph h3{margin:0;flex:1;font-size:19px}
.ph .dot{width:14px;height:14px;border-radius:5px}
.dgm{display:block;margin:0 auto;max-height:150px;width:100%}
.dbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld.full{grid-column:1/-1}
.fld label{font-size:13px;font-weight:700;color:var(--muted)}
.fld input,.fld select{font:inherit;font-size:18px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-height:48px}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.fld .hint{font-size:12.5px;color:var(--muted)}
.sec-t{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 8px}
.step{display:flex;gap:6px}
.step button{width:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:24px;font-weight:700}
.step input{text-align:center;font-weight:800}
.sw{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer}
.sw input{appearance:none;flex:none;width:46px;height:27px;border-radius:99px;background:var(--line);position:relative;transition:.15s;margin:2px 0 0;cursor:pointer}
.sw input::after{content:"";position:absolute;left:3px;top:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{left:22px}
.sw b{display:block}
.sw small{color:var(--muted)}
.sw.on{border-color:var(--accent)}
.res{background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:12px 14px;margin-top:6px}
.res .rt{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.res .rt span{font-weight:800}
.res .rt strong{font-size:26px;font-variant-numeric:tabular-nums}
.res .rt strong em{font-size:14px;font-style:normal;color:var(--muted)}
.res .f{font-size:13.5px;color:var(--muted);margin:2px 0;font-variant-numeric:tabular-nums}
.res .f b{color:var(--ink)}
.res hr{border:0;border-top:1px dashed var(--line);margin:10px 0}
details.guia{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:12px}
details.guia summary{cursor:pointer;font-weight:700}
details.guia p{margin:8px 0 0;font-size:14px;color:var(--muted)}
.foot{display:flex;gap:8px;margin-top:16px}
.foot .btn{flex:1}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--tc);border-radius:14px;padding:14px;text-align:left}
.type b{display:block;font-size:17px}
.type small{color:var(--muted)}
.soon{margin-top:12px;color:var(--muted);font-size:13.5px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d2430;color:#fff;padding:10px 16px;border-radius:12px;z-index:80;font-size:14px;opacity:0;pointer-events:none;transition:.2s}
#toast.show{opacity:1}
.nube{font-size:20px;flex:none;min-width:24px;text-align:center}
/* Acceso */
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}
.gate[hidden]{display:none}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;max-width:390px;width:100%;box-shadow:var(--shadow);text-align:center}
.gcard .logo{width:96px;height:96px;margin:0 auto 4px;display:block}
.gcard h1{font-size:22px;margin:0}
.gcard .sub{color:var(--muted);margin:4px 0 16px}
.gcard .btn{width:100%}
.gcard .fld{text-align:left;margin-bottom:10px}
.gcard .or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:16px 0}
.gcard .or::before,.gcard .or::after{content:"";flex:1;border-top:1px solid var(--line)}
.gmsg{min-height:1.2em;font-size:14px;color:var(--danger);margin:10px 0 0}
.gmsg.ok{color:#15803d}
.gnote{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.gsw{font-size:14px;margin:12px 0 0}
.gsw a{color:var(--ink);font-weight:700}
.gcard .stack{display:grid;gap:8px;margin-top:16px}
.iconbtn.dot{position:relative}
.iconbtn.dot::after{content:"";position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--danger)}
.muser{padding:8px 12px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:4px;word-break:break-all}
.urow{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.urow small{display:block;color:var(--muted);word-break:break-all}
.badge{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:700;margin:6px 6px 0 0;background:var(--soft);border:1px solid var(--line)}
.badge.pendiente{background:#fef3c7;color:#92400e;border-color:#fcd34d}
.badge.aprobado{background:#dcfce7;color:#166534;border-color:#86efac}
.badge.bloqueado{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
.badge.adm{background:#dbeafe;color:#1e40af;border-color:#93c5fd}
.uact{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.uact .btn{min-height:40px;padding:8px 14px;font-size:14px}
@media print{
  .top,.tabs,.fab,.sheet,#toast,.gate{display:none!important}
  body{background:#fff;color:#000;padding:0}
  .wrap{border:0;overflow:visible}
  table{min-width:0;font-size:11px}
  th,td{border-color:#999}
}
</style>
</head>
<body>
<header class="top">
  <img class="logo" id="logoTop" alt="Metrado">
  <input id="obra" class="obra" aria-label="Nombre de la obra" placeholder="Nombre de la obra">
  <span id="nube" class="nube" role="status"></span>
  <button class="iconbtn" id="menuBtn" aria-label="Menú">⋯</button>
  <div class="menu" id="menu" hidden>
    <div class="muser" id="menuUser"></div>
    <button data-m="admin" id="mAdmin" hidden>👥 Administrar usuarios</button>
    <button data-m="csv">📊 Exportar planilla a Excel (CSV)</button>
    <button data-m="print">🖨️ Imprimir planilla</button>
    <button data-m="json">💾 Guardar respaldo (JSON)</button>
    <button data-m="import">📂 Abrir respaldo</button>
    <button data-m="demo">🧪 Cargar ejemplo</button>
    <button data-m="clear" class="danger">🗑️ Borrar todo</button>
    <button data-m="salir">🚪 Cerrar sesión</button>
  </div>
</header>
<main id="main"></main>
<button class="btn fab" id="fab">＋ Agregar elemento</button>
<nav class="tabs" id="tabs">
  <button data-v="elementos" aria-selected="true"><span>🏗️</span>Elementos</button>
  <button data-v="resumen"><span>Σ</span>Resumen</button>
  <button data-v="planilla"><span>📋</span>Planilla</button>
</nav>
<div class="gate" id="gate"><div class="gcard" id="gcard"><p>Cargando…</p></div></div>
<div class="sheet" id="sheet" hidden></div>
<div id="toast"></div>
<input type="file" id="imp" accept=".json,application/json" hidden>

const DIAM = {

const CUANT = { zapata: 70, sobrecimiento: 40, columna: 150, viga: 130 };

function nuevoItem(tipo) {
  const T = TIPOS[tipo]; const d = {};
  T.campos.forEach(c => d[c.k] = c.def);
  const n = S.items.filter(i => i.tipo === tipo).length + 1;

}

/* ============ Cálculo ============ */
function calcular(it) {
  const T = TIPOS[it.tipo]; const d = {};
  T.campos.forEach(c => d[c.k] = c.tipo === 'select' ? it.d[c.k] : num(it.d[c.k]));
  const filas = T.calc(d); const out = {};
  for (const par of Object.keys(PARTIDAS)) {
    if (!it.p[par]) continue;
    if (par === 'acero') { out.acero = calcAcero(it, filas); continue; }
    const rows = filas[par].map(r => {
      const nn = it.n * (r.k ?? 1);
      return { ...r, nn, parcial: nn * (r.l ?? 1) * (r.a ?? 1) * (r.h ?? 1) };
    });
    out[par] = { rows, total: rows.reduce((s, r) => s + r.parcial, 0) };
  }
  return out;
}
function calcAcero(it, filas) {
  const ac = it.ac || nuevoAc(it.tipo); let rows;
  if (ac.modo === 'detalle') {
    rows = (ac.lineas || []).map(x => {
      const dd = DIAM[x.d] || DIAM['1/2'], nn = it.n * num(x.n), l = num(x.l);
      return { t: (x.desc ? x.desc + ' – ' : '') + 'Ø ' + dd.label, nn, l, a: dd.kg, d: x.d, ml: nn * l, parcial: nn * l * dd.kg };
    });
  } else {
    const vol = it.n * filas.concreto.reduce((s, r) => s + (r.k ?? 1) * (r.l ?? 1) * (r.a ?? 1) * (r.h ?? 1), 0), q = num(ac.cuantia);
    rows = [{ t: `Cuantía × volumen de concreto (${fmt(vol)} m³)`, l: vol, a: q, parcial: vol * q }];
  }
  return { rows, total: rows.reduce((s, r) => s + r.parcial, 0) };
}
function totales() {
  const lista = S.items.map(it => ({ it, c: calcular(it) }));
  const t = { concreto: 0, encofrado: 0, acero: 0, porFc: {}, porTipo: {}, porDiam: {}, aceroCuantia: 0 };
  for (const { it, c } of lista) {
    const pt = t.porTipo[it.tipo] ??= { concreto: 0, encofrado: 0, acero: 0, n: 0 };
    pt.n += it.n;
    if (c.acero) {
      t.acero += c.acero.total; pt.acero += c.acero.total;
      for (const r of c.acero.rows) { if (r.d) { const x = t.porDiam[r.d] ??= { kg: 0, ml: 0 }; x.kg += r.parcial; x.ml += r.ml; } else t.aceroCuantia += r.parcial; }
    }
    if (c.concreto) { t.concreto += c.concreto.total; pt.concreto += c.concreto.total; t.porFc[it.fc] = (t.porFc[it.fc] || 0) + c.concreto.total; }
    if (c.encofrado) { t.encofrado += c.encofrado.total; pt.encofrado += c.encofrado.total; }
  }
  return { lista, t };
}

function box(w, h, dx, dy, lw, ld, lh, tipo) {
  const x = 34, y = dy + 16, W = w + dx + x + 40, Hh = h + dy + 16 + 30, col = `var(--c-${tipo})`;
  const tx = (px, py, s, a = 'middle') => `<text x="${px}" y="${py}" text-anchor="${a}" font-size="14" font-weight="700" fill="var(--ink)">${s}</text>`;
  return `<svg viewBox="0 0 ${W} ${Hh}" class="dgm" role="img" aria-label="Esquema del elemento">
    <polygon points="${x},${y} ${x + dx},${y - dy} ${x + w + dx},${y - dy} ${x + w},${y}" fill="${col}" fill-opacity=".85" stroke="var(--ink)" stroke-width="1.2"/>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${col}" fill-opacity=".5" stroke="var(--ink)" stroke-width="1.2"/>
    <polygon points="${x + w},${y} ${x + w + dx},${y - dy} ${x + w + dx},${y + h - dy} ${x + w},${y + h}" fill="${col}" fill-opacity=".7" stroke="var(--ink)" stroke-width="1.2"/>
    ${tx(x + w / 2, y + h + 20, lw)}${tx(x - 8, y + h / 2 + 5, lh, 'end')}${tx(x + w + dx / 2 + 8, y - dy / 2 - 6, ld, 'start')}
  </svg>`;
}
function diagrama(it) {
  const t = it.tipo, d = it.d;
  if (t === 'zapata') return box(120, 34, 44, 24, 'L', 'B', 'h', t);
  if (t === 'sobrecimiento') return box(180, 30, 26, 14, 'L', 'e', 'h', t);
  if (t === 'viga') return box(180, 34, 26, 14, 'L', 'b', 'h', t);
  if (d.forma === 'circ') {
    return `<svg viewBox="0 0 200 170" class="dgm" role="img" aria-label="Columna circular">
      <path d="M66 34 V138 A34 11 0 0 0 134 138 V34 Z" fill="var(--c-columna)" fill-opacity=".55" stroke="var(--ink)" stroke-width="1.2"/>
      <ellipse cx="100" cy="34" rx="34" ry="11" fill="var(--c-columna)" fill-opacity=".85" stroke="var(--ink)" stroke-width="1.2"/>
      <text x="100" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">Ø D</text>
      <text x="56" y="92" text-anchor="end" font-size="14" font-weight="700" fill="var(--ink)">h</text></svg>`;
  }
  return box(40, 110, 24, 16, 'b', 't', 'h', t);
}

/* ============ Vistas ============ */
function render() {
  $('#obra').value = S.obra;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.v === view));
  $('#fab').hidden = view !== 'elementos';
  $('#main').innerHTML = view === 'elementos' ? vElementos() : view === 'resumen' ? vResumen() : vPlanilla();
}

function vElementos() {
  if (!S.items.length) return `<div class="empty"><div style="font-size:42px">🏗️</div><h3>Empieza tu metrado</h3>
    <p>Agrega zapatas, sobrecimientos, columnas o vigas. Tú decides qué partidas metrar en cada uno: concreto, encofrado o ambos.</p>
    <div class="actions" style="justify-content:center"><button class="btn" data-act="add">＋ Agregar elemento</button><button class="btn sec" data-act="demo">Ver un ejemplo</button></div></div>`;
  let h = '';
  for (const [k, T] of Object.entries(TIPOS)) {
    const its = S.items.filter(i => i.tipo === k); if (!its.length) continue;
    h += `<h2 class="grp"><i style="background:var(--c-${k})"></i>${T.plural} · ${its.length}</h2>`;
    for (const it of its) {
      const c = calcular(it);
      const dm = T.campos.filter(f => f.tipo !== 'select' && (!f.si || f.si(it.d))).map(f => `${f.s}=${fmt(num(it.d[f.k]))}`).join(' · ');
      h += `<button class="card" style="border-left-color:var(--c-${k})" data-edit="${it.id}">
        <div class="t"><b>${esc(it.nombre)}</b>${it.nivel ? `<span class="nv">${esc(it.nivel)}</span>` : ''}<span class="q">× ${it.n}</span></div>
        <div class="dm">${dm}${it.p.concreto ? ` · f'c ${it.fc}` : ''}</div>
        <div class="chips">${c.concreto ? `<span class="chip">Concreto ${fmt(c.concreto.total)} m³</span>` : `<span class="chip off">sin concreto</span>`}
        ${c.encofrado ? `<span class="chip enc">Encofrado ${fmt(c.encofrado.total)} m²</span>` : `<span class="chip off">sin encofrado</span>`}
        ${c.acero ? `<span class="chip ace">Acero ${fmt(c.acero.total)} kg</span>` : `<span class="chip off">sin acero</span>`}</div></button>`;
    }
  }
  return h;
}

function vResumen() {
  if (!S.items.length) return `<div class="empty"><p>Aún no hay elementos. Agrégalos en la pestaña Elementos.</p></div>`;
  const { t } = totales();
  let h = `<div class="big"><div class="kpi"><small>Concreto total</small><div class="v">${fmt(t.concreto)} <em>m³</em></div></div>
    <div class="kpi"><small>Encofrado total</small><div class="v">${fmt(t.encofrado)} <em>m²</em></div></div>
    <div class="kpi"><small>Acero total</small><div class="v">${fmt(t.acero)} <em>kg</em></div></div></div>`;
  const fcs = Object.keys(t.porFc).sort();
  if (fcs.length) h += `<div class="box"><h3>Concreto por resistencia</h3>${fcs.map(f => `<div class="tr"><span>f'c = ${f} kg/cm²</span><b>${fmt(t.porFc[f])} m³</b></div>`).join('')}</div>`;
  const ds = Object.keys(DIAM).filter(k => t.porDiam[k]);
  if (ds.length || t.aceroCuantia) h += `<div class="box"><h3>Acero por diámetro</h3>` + ds.map(k => `<div class="tr"><span>Ø ${DIAM[k].label}</span><b>${fmt(t.porDiam[k].kg)} kg · ${fmt(t.porDiam[k].ml, 1)} m <small style="font-weight:500;color:var(--muted)">(≈ ${Math.ceil(t.porDiam[k].ml / 9)} var. de 9 m)</small></b></div>`).join('')
    + (t.aceroCuantia ? `<div class="tr"><span>Calculado por cuantía (sin desglose)</span><b>${fmt(t.aceroCuantia)} kg</b></div>` : '') + `</div>`;
  h += `<div class="box"><h3>Por tipo de elemento</h3>` + Object.entries(TIPOS).filter(([k]) => t.porTipo[k]).map(([k, T]) => {
    const p = t.porTipo[k];
    return `<div class="tr"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c-${k});margin-right:8px"></i>${T.plural} (${p.n})</span><b>${fmt(p.concreto)} m³ · ${fmt(p.encofrado)} m² · ${fmt(p.acero)} kg</b></div>`;
  }).join('') + `</div>`;
  h += `<p style="color:var(--muted);font-size:13px;margin-top:14px">Metrado neto: no incluye desperdicios. El detalle de cada cálculo está en la pestaña Planilla.</p>`;
  return h;
}

function vPlanilla() {
  if (!S.items.length) return `<div class="empty"><p>Aún no hay elementos. Agrégalos en la pestaña Elementos.</p></div>`;
  const { lista } = totales();
  let h = `<div class="actions"><button class="btn sec" data-m="csv">📊 Excel (CSV)</button><button class="btn sec" data-m="print">🖨️ Imprimir</button></div>`;
  h += `<p style="margin:12px 0 0;font-weight:700">${esc(S.obra)}</p>`;
  let n = 0;
  for (const [par, P] of Object.entries(PARTIDAS)) {
    let body = '', total = 0;
    for (const [k, T] of Object.entries(TIPOS)) {
      const its = lista.filter(x => x.it.tipo === k && x.c[par]); if (!its.length) continue;
      body += `<tr><td colspan="6" style="background:var(--soft);font-weight:700;text-align:left">${T.plural}</td></tr>`;
      let sub = 0;
      for (const { it, c } of its) for (const r of c[par].rows) {
        sub += r.parcial;
        const fc = par === 'concreto' ? ` f'c=${it.fc}` : '';
        body += `<tr><td>${esc(it.nombre)}${it.nivel ? ' (' + esc(it.nivel) + ')' : ''}${fc} – ${esc(r.t)}</td><td>${r.nn == null ? '' : fmtN(r.nn)}</td><td>${r.l == null ? '' : fmt(r.l)}</td><td>${r.a == null ? '' : fmt(r.a, par === 'acero' ? 3 : 2)}</td><td>${r.h == null ? '' : fmt(r.h)}</td><td><b>${fmt(r.parcial)}</b></td></tr>`;
      }
      total += sub;
      body += `<tr class="sub"><td colspan="5">Subtotal ${T.plural.toLowerCase()}</td><td>${fmt(sub)}</td></tr>`;
    }
    if (!body) continue;
    n++;
    h += `<h2 class="part">${String(n).padStart(2, '0')} ${P.plan} (${P.u})</h2><div class="wrap"><table>
      <thead><tr><th>Descripción</th>${P.cols.map(c => `<th>${c}</th>`).join('')}<th>Parcial</th></tr></thead><tbody>${body}
      <tr class="tot"><td colspan="5">TOTAL ${P.plan}</td><td>${fmt(total)} ${P.u}</td></tr></tbody></table></div>`;
  }
  return h;
}

/* ============ Editor ============ */
function openEditor(id, tipo) {
  if (id) { ed = clone(S.items.find(i => i.id === id)); ed.isNew = false; ed.ac ??= nuevoAc(ed.tipo); ed.ac.lineas ??= []; }
  else { ed = nuevoItem(tipo); ed.isNew = true; }
  drawEditor(true);
  $('#sheet').hidden = false;
}
function closeEditor() { $('#sheet').hidden = true; ed = null; }

function drawEditor(reset) {
  const T = TIPOS[ed.tipo], sh = $('#sheet');
  const old = sh.querySelector('.panel'), top = old ? old.scrollTop : 0;
  const campos = T.campos.filter(c => !c.si || c.si(ed.d)).map(c => {
    if (c.tipo === 'select') return `<div class="fld full"><label>${c.label}</label><select data-d="${c.k}">${c.op.map(([v, l]) => `<option value="${v}" ${String(ed.d[c.k]) === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>`;
    return `<div class="fld"><label>${c.label} <span style="font-weight:500">(m)</span></label><input inputmode="decimal" data-d="${c.k}" value="${esc(ed.d[c.k])}" onfocus="this.select()">${c.hint ? `<span class="hint">${c.hint}</span>` : ''}</div>`;
  }).join('');
  const sw = (par, tit, small) => `<label class="sw ${ed.p[par] ? 'on' : ''}"><input type="checkbox" data-p="${par}" ${ed.p[par] ? 'checked' : ''}><span><b>${tit}</b><small>${small}</small></span></label>`;
  sh.innerHTML = `<div class="panel" role="dialog" aria-label="${T.nombre}">
    <div class="ph"><span class="dot" style="background:var(--c-${ed.tipo})"></span><h3>${ed.isNew ? 'Nueva' : ''} ${T.nombre.toLowerCase()}</h3><button class="iconbtn" data-act="close" aria-label="Cerrar">✕</button></div>
    <div class="dbox">${diagrama(ed)}</div>
    <div class="grid">
      <div class="fld"><label>Nombre / código</label><input data-b="nombre" value="${esc(ed.nombre)}" onfocus="this.select()"></div>
      <div class="fld"><label>Nivel / eje (opcional)</label><input data-b="nivel" value="${esc(ed.nivel)}" placeholder="Ej. Piso 1, Eje A"></div>
      <div class="fld full"><label>Cantidad de elementos iguales</label><div class="step"><button data-act="menos" aria-label="Menos">−</button><input data-b="n" inputmode="numeric" value="${ed.n}" onfocus="this.select()"><button data-act="mas" aria-label="Más">＋</button></div></div>
    </div>
    <div class="sec-t">Medidas</div><div class="grid">${campos}</div>
    <div class="sec-t">¿Qué vas a metrar?</div>
    ${sw('concreto', 'Concreto (m³)', 'Volumen del elemento')}
    ${ed.p.concreto ? `<div class="fld" style="margin:-2px 0 8px"><label>Resistencia del concreto f'c (kg/cm²)</label><select data-b="fc">${FCS.map(f => `<option ${ed.fc === f ? 'selected' : ''}>${f}</option>`).join('')}</select></div>` : ''}
    ${sw('encofrado', 'Encofrado (m²)', T.hints.encofrado)}
    ${sw('acero', 'Acero (kg)', T.hints.acero)}
    ${acBlock()}
    <div class="sec-t">Resultado</div><div class="res" id="res"></div>
    <details class="guia"><summary>¿Cómo se mide una ${T.nombre.toLowerCase()}?</summary><p>${T.guia}</p></details>
    <div class="foot"><button class="btn" data-act="save">${ed.isNew ? 'Agregar' : 'Guardar'}</button>${ed.isNew ? '' : '<button class="btn sec" data-act="dup">Duplicar</button><button class="btn dng" data-act="del">Eliminar</button>'}</div>
  </div>`;
  sh.querySelector('.panel').scrollTop = reset ? 0 : top;
  updRes();
}

function acBlock() {
  if (!ed.p.acero) return '';
  const ac = ed.ac;
  let h = `<div class="acb"><div class="fld"><label>¿Cómo calcular el acero?</label><select data-ac="modo">
    <option value="cuantia" ${ac.modo !== 'detalle' ? 'selected' : ''}>Por cuantía (kg/m³) – rápido</option>
    <option value="detalle" ${ac.modo === 'detalle' ? 'selected' : ''}>Detallando los fierros – preciso</option></select></div>`;
  if (ac.modo === 'detalle') {
    h += ac.lineas.map((x, i) => `<div class="ln"><input data-lf="desc" data-i="${i}" placeholder="Descripción (ej. longitudinal, estribos)" value="${esc(x.desc)}">
      <div class="ln3"><select data-lf="d" data-i="${i}">${Object.entries(DIAM).map(([k, v]) => `<option value="${k}" ${x.d === k ? 'selected' : ''}>Ø ${v.label}</option>`).join('')}</select>
      <input inputmode="numeric" data-lf="n" data-i="${i}" placeholder="N° barras" value="${esc(x.n)}" onfocus="this.select()">
      <input inputmode="decimal" data-lf="l" data-i="${i}" placeholder="Largo c/u (m)" value="${esc(x.l)}" onfocus="this.select()">
      <button data-act="dell" data-i="${i}" aria-label="Quitar">✕</button></div></div>`).join('');
    h += `<button class="btn sec" data-act="addl">＋ Agregar fierro</button><span class="hint" style="font-size:12.5px;color:var(--muted)">Pon las barras de <b>un</b> elemento (estribos: cantidad × largo de cada uno). Se multiplica por la cantidad de elementos. Incluye traslapes y ganchos en el largo.</span>`;
  } else {
    h += `<div class="fld"><label>Cuantía (kg de acero por m³ de concreto)</label><input inputmode="decimal" data-ac="cuantia" value="${esc(ac.cuantia)}" onfocus="this.select()"><span class="hint">Valor referencial. Ajústalo según tus planos o tu experiencia.</span></div>`;
  }
  return h + '</div>';
}

function updRes() {
  const c = calcular(ed), el = $('#res'); let h = '';
  const ks = Object.keys(c);
  if (!ks.length) h = `<span style="color:var(--muted)">Activa al menos una partida para ver el resultado.</span>`;
  ks.forEach((par, i) => {
    const P = PARTIDAS[par];
    if (i) h += '<hr>';
    h += `<div class="rt"><span>${P.nombre}</span><strong>${fmt(c[par].total)} <em>${P.u}</em></strong></div>`;
    for (const r of c[par].rows) {
      const parts = ['nn', 'l', 'a', 'h'].filter(k => r[k] != null).map(k => k === 'nn' ? fmtN(r.nn) : fmt(r[k], par === 'acero' && k === 'a' ? 3 : 2));
      h += `<div class="f">${esc(r.t)}: ${parts.join(' × ')} = <b>${fmt(r.parcial)}</b></div>`;
    }
  });
  el.innerHTML = h;
}

/* ============ Exportar / importar ============ */
function descargar(nombre, texto, tipo) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([texto], { type: tipo }));
  a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
}
function exportCSV() {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['Partida', 'Tipo', 'Elemento', 'Nivel', "f'c", 'Descripcion', 'N', 'Largo', 'Ancho', 'Alto', 'Parcial', 'Unidad']];
  for (const { it, c } of totales().lista) for (const [par, P] of Object.entries(PARTIDAS)) {
    if (!c[par]) continue;
    for (const r of c[par].rows) rows.push([P.nombre, TIPOS[it.tipo].nombre, it.nombre, it.nivel, par === 'concreto' ? it.fc : '', r.t, r.nn, r.l ?? '', r.a ?? '', r.h ?? '', +r.parcial.toFixed(4), P.u]);
  }
  descargar((S.obra || 'metrado').replace(/[^\w\-]+/g, '_') + '.csv', '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
}
function demo() {
  const mk = (tipo, nombre, nivel, n, d, p, fc = '210') => { const it = nuevoItem(tipo); Object.assign(it, { nombre, nivel, n, fc }); Object.assign(it.d, d); if (p) Object.assign(it.p, p); S.items.push(it); return it; };
  if (!S.items.length) S.obra = 'Vivienda unifamiliar (ejemplo)';
  mk('zapata', 'Z-1', 'Cimentación', 4, { L: 1.4, B: 1.4, H: 0.6 });
  mk('zapata', 'Z-2', 'Cimentación', 2, { L: 1.8, B: 1.2, H: 0.6 }, { encofrado: true });
  mk('sobrecimiento', 'SC-1', 'Eje A-D', 1, { L: 28.4, A: 0.15, H: 0.4 }, null, '175');
  mk('columna', 'C-1', 'Piso 1', 6, { b: 0.25, t: 0.4, H: 2.6 }).ac = { modo: 'detalle', cuantia: 150, lineas: [
    { desc: 'Longitudinal', d: '5/8', n: 6, l: 3.4 }, { desc: 'Estribos', d: '3/8', n: 18, l: 1.2 }] };
  mk('columna', 'C-2', 'Piso 1', 2, { forma: 'circ', D: 0.4, H: 2.6 });
  mk('viga', 'VP-101', 'Piso 1', 3, { L: 4.1, b: 0.25, h: 0.5, e: 0.2 }).ac = { modo: 'detalle', cuantia: 130, lineas: [
    { desc: 'Superior corrido', d: '5/8', n: 2, l: 4.9 }, { desc: 'Inferior', d: '3/4', n: 3, l: 4.9 }, { desc: 'Estribos', d: '3/8', n: 24, l: 1.3 }] };
  guardar(); render(); toast('Ejemplo cargado');
}
let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200); }

/* ============ Eventos ============ */
$('#obra').addEventListener('input', e => { S.obra = e.target.value; guardar(); });
$('#menuBtn').onclick = e => { e.stopPropagation(); $('#menu').hidden = !$('#menu').hidden; };
document.addEventListener('click', e => { if (!e.target.closest('#menu')) $('#menu').hidden = true; });
$('#tabs').onclick = e => { const b = e.target.closest('button'); if (b) { view = b.dataset.v; render(); scrollTo(0, 0); } };
$('#fab').onclick = () => openTipos();

function openTipos() {
  ed = null;
  $('#sheet').innerHTML = `<div class="panel"><div class="ph"><h3>¿Qué elemento vas a metrar?</h3><button class="iconbtn" data-act="close" aria-label="Cerrar">✕</button></div>
    <div class="types">${Object.entries(TIPOS).map(([k, T]) => `<button class="type" style="--tc:var(--c-${k})" data-tipo="${k}"><b>${T.nombre}</b><small>${T.sub}</small></button>`).join('')}</div>
    <p class="soon">Próximamente: losas, muros, escaleras, acero…</p></div>`;
  $('#sheet').hidden = false;
}

document.addEventListener('click', async e => {
  const m = e.target.closest('[data-m]');
  if (m) {
    $('#menu').hidden = true;
    const a = m.dataset.m;
    if (a === 'csv') exportCSV();
    else if (a === 'print') { view = 'planilla'; render(); setTimeout(() => print(), 100); }
    else if (a === 'json') descargar((S.obra || 'metrado').replace(/[^\w\-]+/g, '_') + '.json', JSON.stringify(S, null, 1), 'application/json');
    else if (a === 'import') $('#imp').click();
    else if (a === 'demo') demo();
    else if (a === 'admin') openAdmin();
    else if (a === 'salir') {
      await empujar();                                    // sube lo pendiente y limpia la copia local (equipos compartidos)
      if (KEY && !meta(KEY).pend) { try { localStorage.removeItem(KEY); localStorage.removeItem(KEY + '-meta'); } catch (e) {} }
      else if (!confirm('Hay cambios que aún no se subieron a la nube (sin internet). Si cierras sesión se quedan solo en este dispositivo. ¿Cerrar sesión igual?')) return;
      sb.auth.signOut();
    }
    else if (a === 'clear' && confirm('¿Borrar TODOS los elementos de esta obra (también en la nube)? No se puede deshacer.')) { S = { obra: 'Mi obra', items: [] }; guardar(); render(); }
    return;
  }
  const ed1 = e.target.closest('[data-edit]'); if (ed1) return openEditor(ed1.dataset.edit);
  const ti = e.target.closest('[data-tipo]'); if (ti) return openEditor(null, ti.dataset.tipo);
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'add') openTipos();
  else if (act === 'demo') demo();
  else if (act === 'close') closeEditor();
  else if (act === 'addl') { ed.ac.lineas.push({ desc: '', d: '1/2', n: 4, l: '' }); drawEditor(); }
  else if (act === 'dell') { ed.ac.lineas.splice(+a.dataset.i, 1); drawEditor(); }
  else if (act === 'menos' || act === 'mas') {
    ed.n = Math.max(1, (parseInt(ed.n) || 1) + (act === 'mas' ? 1 : -1));
    $('#sheet [data-b="n"]').value = ed.n; updRes();
  }
  else if (act === 'save' || act === 'dup') {
    ed.n = Math.max(1, parseInt(ed.n) || 1); ed.nombre = ed.nombre.trim() || TIPOS[ed.tipo].pref;
    const { isNew, ...it } = ed;
    if (act === 'dup') { it.id = uid(); it.nombre += ' (copia)'; S.items.push(it); }
    else if (isNew) S.items.push(it);
    else S.items[S.items.findIndex(i => i.id === it.id)] = it;
    guardar(); closeEditor(); render(); toast(act === 'dup' ? 'Elemento duplicado' : 'Guardado');
  }
  else if (act === 'del' && confirm(`¿Eliminar "${ed.nombre}"?`)) {
    S.items = S.items.filter(i => i.id !== ed.id); guardar(); closeEditor(); render(); toast('Eliminado');
  }
});
$('#sheet').addEventListener('mousedown', e => { if (e.target.id === 'sheet') closeEditor(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeEditor(); $('#menu').hidden = true; } });
$('#sheet').addEventListener('input', e => {
  const t = e.target; if (!ed) return;
  if (t.dataset.d) { ed.d[t.dataset.d] = t.value; updRes(); }
  else if (t.dataset.lf) { ed.ac.lineas[+t.dataset.i][t.dataset.lf] = t.value; updRes(); }
  else if (t.dataset.ac === 'cuantia') { ed.ac.cuantia = t.value; updRes(); }
  else if (t.dataset.b === 'n') { ed.n = parseInt(t.value) || 1; updRes(); }
  else if (t.dataset.b) { ed[t.dataset.b] = t.value; }
});
$('#sheet').addEventListener('change', e => {
  const t = e.target; if (!ed) return;
  if (t.dataset.p) { ed.p[t.dataset.p] = t.checked; drawEditor(); }
  else if (t.dataset.d && t.tagName === 'SELECT') { ed.d[t.dataset.d] = t.value; drawEditor(); }
  else if (t.dataset.ac === 'modo') { ed.ac.modo = t.value; drawEditor(); }
  else if (t.dataset.b === 'fc') { ed.fc = t.value; }
});
$('#imp').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { const j = JSON.parse(r.result); if (!Array.isArray(j.items)) throw 0; S = j; guardar(); render(); toast('Respaldo abierto'); } catch (_) { toast('Archivo no válido'); } };
  r.readAsText(f); e.target.value = '';
};

/* ============ Acceso con Supabase ============
   La URL y la clave "publishable" son públicas por diseño: la seguridad real
   la dan las reglas (RLS) de la base de datos, no ocultar esta clave.        */
const SUPA_URL = 'https://pyuqqgjyzkxglblkdtbl.supabase.co';
const SUPA_KEY = 'sb_publishable_WXo_LaxB62Q5zyThVibA1w_ei1cwmRH';
const sb = window.supabase ? window.supabase.createClient(SUPA_URL, SUPA_KEY) : null;
let user = null, perfil = null, gModo = 'entrar';
const redir = () => location.origin + location.pathname;

function gate(html) { $('#gate').hidden = false; $('#gcard').innerHTML = html; }
function gMsg(m, ok) {
  const el = $('#gmsg'); if (!el) return;
  el.textContent = /failed to fetch|networkerror|load failed/i.test(m) ? 'No se pudo conectar con el servidor. Revisa tu internet y desactiva bloqueadores de anuncios, VPN o antivirus web para esta página; luego intenta de nuevo.' : m;
  el.className = 'gmsg' + (ok ? ' ok' : '');
}
function gLogin(msg = '') {
  const file = location.protocol === 'file:', crear = gModo === 'crear';
  gate(`<img class="logo" src="${LOGO}" alt="Metrado"><h1>Metrado Estructural</h1><p class="sub">Ingresa para continuar</p>
    <button class="btn sec" data-g="google" ${file ? 'disabled' : ''}><b style="color:#4285f4">G</b>&nbsp; Continuar con Google</button>
    ${file ? '<p class="gnote">Google solo funciona si la app está publicada (https) o abierta en localhost, no desde el archivo suelto.</p>' : ''}
    <div class="or"><span>o con tu correo</span></div>
    <form id="gform">
      <div class="fld"><label>Correo</label><input type="email" name="email" required autocomplete="email"></div>
      <div class="fld"><label>Contraseña</label><input type="password" name="pass" required minlength="6" autocomplete="${crear ? 'new-password' : 'current-password'}"></div>
      <button class="btn" type="submit">${crear ? 'Crear cuenta' : 'Entrar'}</button>
    </form><p id="gmsg" class="gmsg">${esc(msg)}</p>
    <p class="gsw">${crear ? '¿Ya tienes cuenta? <a href="#" data-gmodo="entrar">Entrar</a>' : '¿Primera vez? <a href="#" data-gmodo="crear">Crear cuenta</a>'}</p>`);
}
function gEstado() {
  const bloq = perfil.estado === 'bloqueado';
  gate(`<div style="font-size:44px">${bloq ? '⛔' : '⏳'}</div><h1>${bloq ? 'Acceso no permitido' : 'Cuenta pendiente de aprobación'}</h1>
    <p class="sub">${bloq ? 'El administrador desactivó el acceso de esta cuenta.' : 'Ya te registraste. El administrador debe aprobar tu acceso antes de que puedas usar la app.'}<br><b>${esc(perfil.email)}</b></p>
    <div class="stack"><button class="btn" data-gx="refrescar">Revisar de nuevo</button><button class="btn sec" data-gx="salir">Cerrar sesión</button></div>`);
}
function cerrarApp() { clearTimeout(tEmp); closeEditor(); KEY = null; S = vacio(); $('#main').innerHTML = ''; estadoNube(''); }

/* ---- Sincronización con la nube ---- */
function estadoNube(t, err) {
  const el = $('#nube');
  el.textContent = { ok: '☁️', sync: '🔄', off: '📴' }[t] || '';
  el.title = { ok: 'Guardado en la nube', sync: 'Sincronizando…', off: 'Sin conexión: se subirá cuando vuelva internet' + (err ? ' (' + err + ')' : '') }[t] || '';
}
async function empujar() {
  if (!sb || !KEY || !user || !perfil || perfil.estado !== 'aprobado') return;
  clearTimeout(tEmp);
  const k = KEY, v = ver; estadoNube('sync');
  const fila = { nombre: S.obra, datos: { items: S.items }, actualizado: new Date().toISOString() };
  try {
    const m = meta(k); let r;
    if (m.id) { r = await sb.from('obras').update(fila).eq('id', m.id).select('id'); if (r.error) throw r.error; if (!r.data.length) m.id = null; }
    if (!m.id) { r = await sb.from('obras').insert(fila).select('id'); if (r.error) throw r.error; m.id = r.data[0].id; }
    if (KEY !== k) return;
    m.pend = ver !== v; setMeta(k, m);
    if (m.pend) tEmp = setTimeout(empujar, 800); else estadoNube('ok');
  } catch (e) { estadoNube('off', e.message); }
}
async function sincronizar() {
  if (!sb || !KEY || !user) return;
  const k = KEY, v0 = ver; estadoNube('sync');
  try {
    if (meta(k).pend) { await empujar(); return; }
    const { data, error } = await sb.from('obras').select('id,nombre,datos').order('actualizado', { ascending: false }).limit(1);
    if (error) throw error;
    if (KEY !== k || ver !== v0 || meta(k).pend) return;      // hubo cambios locales mientras tanto
    if (!data.length) { await empujar(); return; }            // primera vez: sube lo que hay en este dispositivo
    const o = data[0]; setMeta(k, { id: o.id, pend: false });
    const nuevo = { obra: o.nombre, items: (o.datos && o.datos.items) || [] };
    if (JSON.stringify(nuevo) !== JSON.stringify(S)) {
      if (!$('#sheet').hidden) { estadoNube('ok'); return; }  // no pisar lo que se está editando
      S = nuevo; try { localStorage.setItem(k, JSON.stringify(S)); } catch (e) {}
      render();
    }
    estadoNube('ok');
  } catch (e) { estadoNube('off', e.message); }
}
window.addEventListener('online', () => { if (KEY) sincronizar(); });

async function manejarSesion(session) {
  if (!session) { user = null; perfil = null; cerrarApp(); gLogin(); return; }
  user = session.user;
  const { data, error } = await sb.from('perfiles').select('*').eq('id', user.id).maybeSingle();
  if (error || !data) {
    gate(`<h1>No se pudo verificar tu cuenta</h1><p class="sub">${esc(error ? error.message : 'Perfil no encontrado')}</p><div class="stack"><button class="btn" data-gx="refrescar">Reintentar</button><button class="btn sec" data-gx="salir">Cerrar sesión</button></div>`);
    return;
  }
  perfil = data;
  if (perfil.estado === 'aprobado') abrirApp(); else { cerrarApp(); gEstado(); }
}
function abrirApp() {
  KEY = 'metrado-v1-' + user.id;
  S = cargar(perfil.rol === 'admin');
  $('#gate').hidden = true;
  $('#menuUser').textContent = perfil.email + (perfil.rol === 'admin' ? ' · administrador' : '');
  $('#mAdmin').hidden = perfil.rol !== 'admin';
  view = 'elementos'; render();
  if (perfil.rol === 'admin') contarPendientes();
  sincronizar();
}
async function contarPendientes() {
  const { count } = await sb.from('perfiles').select('id', { count: 'exact', head: true }).eq('estado', 'pendiente');
  $('#mAdmin').textContent = '👥 Administrar usuarios' + (count ? ` (${count} pendiente${count > 1 ? 's' : ''})` : '');
  $('#menuBtn').classList.toggle('dot', !!count);
}

$('#gate').addEventListener('click', async e => {
  const g = e.target.closest('[data-g]'), sw = e.target.closest('[data-gmodo]'), x = e.target.closest('[data-gx]');
  if (sw) { e.preventDefault(); gModo = sw.dataset.gmodo; gLogin(); }
  else if (g) {
    const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: redir() } });
    if (error) gMsg('No se pudo iniciar con Google: ' + error.message);
  }
  else if (x) {
    if (x.dataset.gx === 'salir') sb.auth.signOut();
    else { gate('<p>Cargando…</p>'); const { data } = await sb.auth.getSession(); manejarSesion(data.session); }
  }
});
$('#gate').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, email = f.email.value.trim(), pass = f.pass.value, btn = f.querySelector('button');
  btn.disabled = true; gMsg('');
  if (gModo === 'crear') {
    const { data, error } = await sb.auth.signUp({ email, password: pass, options: { emailRedirectTo: location.protocol === 'file:' ? undefined : redir() } });
    if (error) gMsg(error.message);
    else if (data.user && data.user.identities && !data.user.identities.length) gMsg('Ese correo ya está registrado. Prueba entrar.');
    else if (!data.session) gMsg('Te enviamos un correo para confirmar tu cuenta. Confírmalo y luego entra.', true);
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (error) gMsg(/Invalid login/i.test(error.message) ? 'Correo o contraseña incorrectos.' : /not confirmed/i.test(error.message) ? 'Primero confirma tu correo (revisa tu bandeja).' : error.message);
  }
  btn.disabled = false;
});

/* ---- Panel de administración ---- */
async function openAdmin() {
  ed = null;
  const sh = $('#sheet'), cab = `<div class="ph"><h3>Usuarios</h3><button class="iconbtn" data-act="close" aria-label="Cerrar">✕</button></div>`;
  sh.innerHTML = `<div class="panel">${cab}<p>Cargando…</p></div>`; sh.hidden = false;
  const { data, error } = await sb.from('perfiles').select('*').order('creado', { ascending: false });
  if (error) { sh.innerHTML = `<div class="panel">${cab}<p>No se pudo cargar: ${esc(error.message)}</p></div>`; return; }
  const ord = { pendiente: 0, aprobado: 1, bloqueado: 2 };
  data.sort((a, b) => ord[a.estado] - ord[b.estado]);
  const btn = (txt, campo, val, uid, cls = '') => `<button class="btn ${cls}" data-adm="${campo}" data-val="${val}" data-uid="${uid}">${txt}</button>`;
  sh.innerHTML = `<div class="panel">${cab}${data.map(u => {
    const yo = u.id === user.id;
    const acc = yo ? '<small>(tú)</small>' : [
      u.estado !== 'aprobado' ? btn('Aprobar', 'estado', 'aprobado', u.id) : '',
      u.estado === 'pendiente' ? btn('Rechazar', 'estado', 'bloqueado', u.id, 'dng') : '',
      u.estado === 'aprobado' ? btn('Bloquear', 'estado', 'bloqueado', u.id, 'dng') : '',
      u.estado === 'aprobado' ? btn(u.rol === 'admin' ? 'Quitar admin' : 'Hacer admin', 'rol', u.rol === 'admin' ? 'usuario' : 'admin', u.id, 'sec') : '',
    ].join('');
    return `<div class="urow"><b>${esc(u.nombre || u.email)}</b><small>${esc(u.email)} · ${new Date(u.creado).toLocaleDateString('es-PE')}</small>
      <span class="badge ${u.estado}">${u.estado}</span>${u.rol === 'admin' ? '<span class="badge adm">admin</span>' : ''}<div class="uact">${acc}</div></div>`;
  }).join('')}</div>`;
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-adm]'); if (!b) return;
  const { adm, val, uid } = b.dataset;
  if ((val === 'bloqueado' || val === 'admin') && !confirm(val === 'admin' ? '¿Dar permisos de administrador a este usuario? Podrá aprobar y bloquear a otros.' : '¿Quitar el acceso a este usuario?')) return;
  b.disabled = true;
  const { data, error } = await sb.from('perfiles').update({ [adm]: val }).eq('id', uid).select();
  if (error || !data.length) toast('No se pudo cambiar'); else toast('Listo');
  openAdmin(); contarPendientes();
});

function iniciarAuth() {
  if (!sb) { gate('<h1>Sin conexión</h1><p class="sub">No se pudo cargar el servicio de acceso. Revisa tu internet y recarga la página.</p>'); return; }
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === 'TOKEN_REFRESHED' || ev === 'USER_UPDATED') return;
    if (ev === 'SIGNED_IN' && user && session && session.user.id === user.id) return;
    setTimeout(() => manejarSesion(session), 0);
  });
  /* Si bloquean a alguien mientras usa la app, se le corta al volver a la pestaña */
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || !user || !perfil) return;
    const { data } = await sb.from('perfiles').select('estado,rol').eq('id', user.id).maybeSingle();
    if (data && data.estado !== 'aprobado') { perfil = { ...perfil, ...data }; cerrarApp(); gEstado(); }
    else if (data) sincronizar();                         // trae lo que se editó desde otro dispositivo
  });
}
iniciarAuth();
</script>
